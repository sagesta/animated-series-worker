name: Sign GPU worker image

run-name: Sign worker ${{ inputs.image_digest }}

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Immutable worker manifest digest (sha256:...)
        required: true
        type: string
      expected_config_digest:
        description: Expected local Docker image/config digest (sha256:...)
        required: true
        type: string

permissions: {}

concurrency:
  group: sign-gpu-worker-${{ inputs.image_digest }}
  cancel-in-progress: false

jobs:
  sign:
    name: Keyless-sign immutable worker digest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: worker-signing
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/sagesta/animated-series-worker
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      EXPECTED_CONFIG_DIGEST: ${{ inputs.expected_config_digest }}
      SIGNING_IDENTITY: https://github.com/sagesta/animated-series-worker/.github/workflows/sign-worker-image.yml@refs/heads/main
      SIGNING_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "image_digest must be an immutable sha256 digest" >&2
            exit 1
          fi
          if [[ ! "${EXPECTED_CONFIG_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "expected_config_digest must be a sha256 digest" >&2
            exit 1
          fi

      - name: Install checksum-verified Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published manifest and config identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(docker manifest inspect "${IMAGE_NAME}@${IMAGE_DIGEST}")"
          actual_config_digest="$(printf '%s' "${manifest}" | jq -r '.config.digest')"
          if [[ "${actual_config_digest}" != "${EXPECTED_CONFIG_DIGEST}" ]]; then
            echo "Published config digest does not match the expected local image" >&2
            exit 1
          fi

      - name: Sign exact digest with GitHub OIDC
        shell: bash
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Verify canonical workflow signature
        shell: bash
        run: >-
          cosign verify
          --certificate-identity "${SIGNING_IDENTITY}"
          --certificate-oidc-issuer "${SIGNING_ISSUER}"
          "${IMAGE_NAME}@${IMAGE_DIGEST}"
