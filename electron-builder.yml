appId: studio.animated.series
productName: Animated Series Studio
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
artifactName: Animated-Series-Studio-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
